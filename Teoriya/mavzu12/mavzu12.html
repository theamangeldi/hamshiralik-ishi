<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Button Design with Links</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 50px;
      perspective: 1500px;
      padding: 20px;
    }

    .button-group {
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
      justify-content: center;
      transform: rotateX(10deg) rotateY(10deg);
      animation: float 5s ease-in-out infinite;
    }

    a.button {
      background: linear-gradient(145deg, #00ffd5, #00c3ff);
      border: none;
      padding: 15px 30px;
      color: #fff;
      font-size: 1.2rem;
      border-radius: 15px;
      text-decoration: none;
      box-shadow: 0 10px 20px rgba(0, 255, 255, 0.5),
                  inset 0 0 10px #00ffe7;
      cursor: pointer;
      transition: 0.4s;
      display: inline-block;
      transform: perspective(800px) rotateX(10deg) rotateY(-10deg);
    }

    a.button:hover {
      background: linear-gradient(145deg, #00c3ff, #00ffd5);
      transform: perspective(800px) rotateX(0deg) rotateY(0deg) scale(1.1);
      box-shadow: 0 15px 25px rgba(0, 255, 255, 0.7),
                  inset 0 0 15px #00ffe7;
    }

    @keyframes float {
      0%, 100% {
        transform: rotateX(10deg) rotateY(10deg) translateY(0px);
      }
      50% {
        transform: rotateX(10deg) rotateY(10deg) translateY(-15px);
      }
    }

    h1 {
      color: #00ffe7;
      font-size: 2rem;
      text-align: center;
      text-shadow: 0 0 10px #00ffe7;
      margin-bottom: 20px;
      line-height: 1.4;
      animation: glow 2s infinite alternate;
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 10px #00ffe7, 0 0 20px #00ffe7;
      }
      to {
        text-shadow: 0 0 20px #00ffe7, 0 0 40px #00ffe7;
      }
    }

    /* ORTGA QAYTISH tugmasi uchun alohida style */
    .back-button {
      margin-top: 30px;
    }

    .back-button a {
      background: linear-gradient(145deg, #ff00c8, #ff6ec4);
      padding: 12px 25px;
      color: #fff;
      font-size: 1.2rem;
      border-radius: 15px;
      text-decoration: none;
      box-shadow: 0 10px 20px rgba(255, 0, 200, 0.5),
                  inset 0 0 10px #ff00c8;
      transition: 0.3s;
      display: inline-block;
      transform: perspective(800px) rotateX(8deg) rotateY(-8deg);
    }

    .back-button a:hover {
      background: linear-gradient(145deg, #ff6ec4, #ff00c8);
      transform: perspective(800px) rotateX(0deg) rotateY(0deg) scale(1.1);
      box-shadow: 0 15px 25px rgba(255, 0, 200, 0.7),
                  inset 0 0 15px #ff00c8;
    }

  </style>
</head>
<body>
