<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" width="520" height="420">
  <defs>
    <!-- Shaffof fonga mos gradientlar -->
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="glowF" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 100% SHAFFOF FON: HECH QANDAY TO'RTBURCHAK QORA FON YO'Q! -->
  
  <!-- Yorituvchi nafis ambient nur -->
  <circle cx="260" cy="210" r="150" fill="#0d9488" opacity="0.12" filter="url(#glowF)"/>

  <!-- Asosiy 3D Vektor Tibbiy Kompozitsiya -->
          <g transform="translate(190, 130)">
          <circle cx="60" cy="60" r="115" fill="#0d9488" opacity="0.14" filter="url(#glowF)"/>
          
          <!-- Chaqaloq kuvez/beshik shisha gumbazi -->
          <path d="M-40 130 C-40 20 160 20 160 130 Z" fill="url(#grad1)" opacity="0.25" stroke="#2dd4bf" stroke-width="3"/>
          <rect x="-50" y="125" width="220" height="25" rx="10" fill="url(#grad2)"/>
          
          <!-- Chaqaloq silueti -->
          <circle cx="60" cy="65" r="32" fill="url(#grad1)"/>
          <circle cx="50" cy="62" r="4" fill="#ffffff"/>
          <circle cx="70" cy="62" r="4" fill="#ffffff"/>
          <path d="M52 75 Q60 84 68 75" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path d="M25 115 C25 90 95 90 95 115 Z" fill="#ffffff" opacity="0.9"/>

          <!-- T harorat va kislorod ko'rsatkichi -->
          <g transform="translate(5, 160)">
            <rect width="110" height="30" rx="15" fill="rgba(15,23,42,0.9)" stroke="#2dd4bf" stroke-width="1.5"/>
            <text x="55" y="20" fill="#2dd4bf" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" text-anchor="middle">+36.5 ... +37В°C</text>
          </g>
        </g>

  <!-- Yuqori qismdagi nafis tibbiy yorliq -->
  <g transform="translate(260, 30)">
    <rect x="-80" y="0" width="160" height="28" rx="14" fill="rgba(56,189,248,0.12)" stroke="#2dd4bf" stroke-width="1.2"/>
    <text x="0" y="19" fill="#2dd4bf" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" letter-spacing="1" text-anchor="middle">NEONATOLOGIYA</text>
  </g>
</svg>