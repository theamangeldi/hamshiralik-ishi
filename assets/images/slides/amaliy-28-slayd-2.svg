<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" width="520" height="420">
  <defs>
    <!-- Shaffof fonga mos gradientlar -->
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="glowF" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 100% SHAFFOF FON: HECH QANDAY TO'RTBURCHAK QORA FON YO'Q! -->
  
  <!-- Yorituvchi nafis ambient nur -->
  <circle cx="260" cy="210" r="150" fill="#dc2626" opacity="0.12" filter="url(#glowF)"/>

  <!-- Asosiy 3D Vektor Tibbiy Kompozitsiya -->
          <g transform="translate(190, 130)">
          <circle cx="60" cy="60" r="115" fill="#dc2626" opacity="0.15" filter="url(#glowF)"/>
          
          <!-- Ambu qopi sferasi -->
          <ellipse cx="60" cy="50" rx="75" ry="50" fill="url(#grad1)" stroke="#ffffff" stroke-width="3"/>
          <rect x="-30" y="38" width="40" height="24" rx="6" fill="url(#grad2)"/>
          <rect x="110" y="38" width="40" height="24" rx="6" fill="url(#grad2)"/>
          
          <!-- Nafas niqobi -->
          <path d="M140 20 C185 30 185 70 140 80 Z" fill="rgba(255,255,255,0.3)" stroke="#f87171" stroke-width="2.5"/>

          <!-- 30:2 reanimatsiya nisbati -->
          <g transform="translate(0, 160)">
            <rect width="120" height="32" rx="16" fill="rgba(15,23,42,0.9)" stroke="#f87171" stroke-width="1.5"/>
            <text x="60" y="22" fill="#f87171" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" text-anchor="middle">30 : 2 ALGORITM</text>
          </g>
        </g>

  <!-- Yuqori qismdagi nafis tibbiy yorliq -->
  <g transform="translate(260, 30)">
    <rect x="-80" y="0" width="160" height="28" rx="14" fill="rgba(56,189,248,0.12)" stroke="#f87171" stroke-width="1.2"/>
    <text x="0" y="19" fill="#f87171" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" letter-spacing="1" text-anchor="middle">REANIMATSIYA</text>
  </g>
</svg>