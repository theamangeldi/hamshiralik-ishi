<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" width="520" height="420">
  <defs>
    <!-- Shaffof fonga mos gradientlar -->
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glowF" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 100% SHAFFOF FON: HECH QANDAY TO'RTBURCHAK QORA FON YO'Q! -->
  
  <!-- Yorituvchi nafis ambient nur -->
  <circle cx="260" cy="210" r="150" fill="#0284c7" opacity="0.12" filter="url(#glowF)"/>

  <!-- Asosiy 3D Vektor Tibbiy Kompozitsiya -->
          <g transform="translate(190, 130)">
          <circle cx="60" cy="60" r="115" fill="#0284c7" opacity="0.14" filter="url(#glowF)"/>
          
          <!-- Tibbiy emblema (Katta geraldik xoch) -->
          <rect x="42" y="-10" width="36" height="130" rx="16" fill="url(#grad1)"/>
          <rect x="-5" y="37" width="130" height="36" rx="16" fill="url(#grad1)"/>
          <circle cx="60" cy="55" r="28" fill="url(#grad2)" stroke="#ffffff" stroke-width="3"/>
          
          <!-- Stetoskop olivi -->
          <circle cx="60" cy="55" r="14" fill="#ffffff"/>

          <!-- Klinik protokol nishoni -->
          <g transform="translate(0, 165)">
            <rect width="120" height="30" rx="15" fill="rgba(15,23,42,0.9)" stroke="#38bdf8" stroke-width="1.5"/>
            <text x="60" y="20" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" text-anchor="middle">&#9733; KLINIK STANDART</text>
          </g>
        </g>

  <!-- Yuqori qismdagi nafis tibbiy yorliq -->
  <g transform="translate(260, 30)">
    <rect x="-80" y="0" width="160" height="28" rx="14" fill="rgba(56,189,248,0.12)" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="0" y="19" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" letter-spacing="1" text-anchor="middle">HAMSHIRALIK ISHI</text>
  </g>
</svg>