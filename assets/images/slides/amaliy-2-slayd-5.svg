<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" width="520" height="420">
  <defs>
    <!-- Shaffof fonga mos gradientlar -->
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="glowF" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 100% SHAFFOF FON: HECH QANDAY TO'RTBURCHAK QORA FON YO'Q! -->
  
  <!-- Yorituvchi nafis ambient nur -->
  <circle cx="260" cy="210" r="150" fill="#0ea5e9" opacity="0.12" filter="url(#glowF)"/>

  <!-- Asosiy 3D Vektor Tibbiy Kompozitsiya -->
          <g transform="translate(200, 140)">
          <circle cx="50" cy="60" r="115" fill="#0ea5e9" opacity="0.14" filter="url(#glowF)"/>
          
          <!-- O'pka traxeyasi va bronxlar -->
          <path d="M50 -50 L50 15 M50 -10 L15 35 M50 -10 L85 35" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
          
          <!-- Chap o'pka bo'lagi -->
          <path d="M35 25 C-5 25 -30 65 -30 115 C-30 160 10 180 40 155 C40 110 40 70 45 40 Z" fill="url(#grad1)" opacity="0.9" stroke="#38bdf8" stroke-width="2"/>
          
          <!-- O'ng o'pka bo'lagi -->
          <path d="M65 25 C105 25 130 65 130 115 C130 160 90 180 60 155 C60 110 60 70 55 40 Z" fill="url(#grad2)" opacity="0.9" stroke="#38bdf8" stroke-width="2"/>
          
          <!-- Alveolalar va nafas to'lqini -->
          <circle cx="-5" cy="100" r="12" fill="rgba(255,255,255,0.2)"/>
          <circle cx="105" cy="100" r="12" fill="rgba(255,255,255,0.2)"/>
          
          <!-- Nafas ritmi badge -->
          <g transform="translate(-10, 165)">
            <rect width="120" height="32" rx="16" fill="rgba(15,23,42,0.9)" stroke="#38bdf8" stroke-width="1.5"/>
            <text x="60" y="21" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" text-anchor="middle">40-45 ta/daq</text>
          </g>
        </g>

  <!-- Yuqori qismdagi nafis tibbiy yorliq -->
  <g transform="translate(260, 30)">
    <rect x="-80" y="0" width="160" height="28" rx="14" fill="rgba(56,189,248,0.12)" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="0" y="19" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" letter-spacing="1" text-anchor="middle">NAFAS SISTEMASI</text>
  </g>
</svg>