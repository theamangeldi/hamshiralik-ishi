<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Taqdimot | Hamshiralik ishi texnikasi</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <style>
    /* ===== ROOT & THEME ===== */
    :root {
      --font-main: 'Plus Jakarta Sans', system-ui, sans-serif;
      --font-heading: 'Outfit', system-ui, sans-serif;
      --bg: #070b14;
      --bg-card: rgba(12, 20, 40, 0.92);
      --border: rgba(56, 189, 248, 0.35);
      --border-active: rgba(56, 189, 248, 0.8);
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --text-heading: #ffffff;
      --cyan: #00f2fe;
      --blue: #38bdf8;
      --grad: linear-gradient(135deg, #0284c7, #00f2fe);
      --btn-bg: rgba(15, 23, 42, 0.85);
      --btn-border: rgba(56, 189, 248, 0.3);
      --glow: 0 0 60px rgba(14, 165, 233, 0.3);
      --shadow: 0 32px 70px rgba(0, 0, 0, 0.7);
    }
    [data-theme="light"] {
      --bg: #eef4fc;
      --bg-card: rgba(255, 255, 255, 0.96);
      --border: rgba(14, 165, 233, 0.3);
      --border-active: rgba(14, 165, 233, 0.8);
      --text: #1e293b;
      --text-muted: #64748b;
      --text-heading: #0f172a;
      --cyan: #0284c7;
      --blue: #0ea5e9;
      --grad: linear-gradient(135deg, #0284c7, #0ea5e9);
      --btn-bg: rgba(255, 255, 255, 0.9);
      --btn-border: rgba(14, 165, 233, 0.3);
      --glow: 0 20px 50px rgba(14, 165, 233, 0.15);
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-main);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background 0.4s, color 0.4s;
    }

    /* Fon gradient */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 80% 60% at 50% 40%, rgba(14, 165, 233, 0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ===== HEADER ===== */
    .s-header {
      position: relative;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 28px;
      background: rgba(7, 11, 20, 0.5);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255,255,255,0.07);
      flex-shrink: 0;
    }

    .s-header-left { display: flex; align-items: center; gap: 12px; min-width: 0; }

    .btn-back {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 9px 18px;
      border-radius: 50px;
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      color: var(--text-heading);
      text-decoration: none;
      font-weight: 600; font-size: 0.88rem;
      white-space: nowrap;
      transition: all 0.3s ease;
      flex-shrink: 0;
    }
    .btn-back:hover { background: var(--grad); color: #fff; border-color: transparent; transform: translateX(-3px); }

    .topic-sel-wrap { position: relative; min-width: 0; flex: 1; max-width: 400px; }
    .topic-sel {
      width: 100%;
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      color: var(--text-heading);
      padding: 9px 36px 9px 14px;
      border-radius: 50px;
      font-size: 0.84rem; font-weight: 600;
      cursor: pointer; outline: none;
      appearance: none; -webkit-appearance: none;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      transition: border-color 0.3s;
    }
    .topic-sel:focus, .topic-sel:hover { border-color: var(--blue); }
    .topic-sel-icon { position: absolute; right: 13px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--text-muted); font-size: 0.72rem; }

    .s-header-center { flex: 1; text-align: center; min-width: 0; padding: 0 12px; }
    .s-category { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1.2px; font-weight: 700; color: var(--cyan); display: block; margin-bottom: 2px; }
    .s-title { font-family: var(--font-heading); font-size: 1.12rem; font-weight: 700; color: var(--text-heading); white-space: normal; line-height: 1.3; max-width: 860px; margin: 0 auto; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    .s-header-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

    .icon-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      color: var(--text-heading);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 0.9rem;
      transition: all 0.3s ease;
    }
    .icon-btn:hover { background: var(--grad); color: #fff; border-color: transparent; transform: translateY(-2px); }
    .icon-btn.on { background: var(--grad); color: #fff; border-color: transparent; box-shadow: 0 0 14px rgba(0,242,254,0.5); }

    /* ===== PROGRESS BAR ===== */
    .s-progress { width: 100%; height: 3px; background: rgba(255,255,255,0.06); flex-shrink: 0; position: relative; z-index: 50; }
    .s-progress-fill { height: 100%; background: var(--grad); box-shadow: 0 0 10px var(--cyan); transition: width 0.5s cubic-bezier(0.4,0,0.2,1); }

    /* ===== STAGE ===== */
    .s-stage {
      flex: 1;
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 90px;
      overflow: hidden;           /* Ghost text xatolikni hal qiladi */
    }

    /* ===== SLIDE CARD ===== */
    /* Faqat BIR karta ko'rinadi — enter/exit animatsiyalari bilan */
    .slide-card {
      position: absolute;
      width: 100%;
      max-width: 960px;
      min-height: 480px;
      background: var(--bg-card);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 38px 46px;
      box-shadow: var(--shadow), var(--glow);

      /* Boshlang'ich holat (ko'rinmaydi) */
      opacity: 0;
      pointer-events: none;
      transform: translateX(0) scale(0.94);
      transition: none;           /* Animatsiya JS tomonidan boshqariladi */
    }

    /* Aktiv karta */
    .slide-card.is-active {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(0) scale(1);
      border-color: var(--border-active);
      transition: opacity 0.45s ease, transform 0.45s cubic-bezier(0.2,0.8,0.2,1);
    }

    /* Chiqayotgan karta — chapga */
    .slide-card.exit-left {
      opacity: 0;
      pointer-events: none;
      transform: translateX(-60px) scale(0.92) rotateY(8deg);
      transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.4,0,1,1);
    }

    /* Chiqayotgan karta — o'ngga */
    .slide-card.exit-right {
      opacity: 0;
      pointer-events: none;
      transform: translateX(60px) scale(0.92) rotateY(-8deg);
      transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.4,0,1,1);
    }

    /* Kiruvchi karta — chapdan */
    .slide-card.enter-from-left {
      opacity: 0;
      pointer-events: none;
      transform: translateX(-80px) scale(0.92) rotateY(-10deg);
      transition: none;
    }

    /* Kiruvchi karta — o'ngdan */
    .slide-card.enter-from-right {
      opacity: 0;
      pointer-events: none;
      transform: translateX(80px) scale(0.92) rotateY(10deg);
      transition: none;
    }

    /* ===== FULL PRESENTATION CARD LAYOUT (WITHOUT IMAGES) ===== */
    .card-content-wrap {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      min-height: 410px;
      gap: 22px;
      width: 100%;
    }

    /* ===== CARD INNER ===== */
    .card-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-num-pill {
      font-family: var(--font-heading);
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #fff;
      background: var(--grad);
      padding: 6px 16px;
      border-radius: 50px;
      box-shadow: 0 4px 14px rgba(14,165,233,0.4);
    }

    .card-cat-label {
      display: flex; align-items: center; gap: 7px;
      font-size: 0.82rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .card-icon-box {
      width: 44px; height: 44px;
      border-radius: 14px;
      background: rgba(14, 165, 233, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.25rem;
      color: var(--cyan);
    }

    .card-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 18px;
      justify-content: center;
      padding: 8px 0;
    }

    .card-title {
      font-family: var(--font-heading);
      font-size: 1.85rem;
      font-weight: 800;
      line-height: 1.35;
      color: var(--text-heading);
      letter-spacing: -0.01em;
    }

    .card-line {
      width: 72px;
      height: 4px;
      border-radius: 2px;
      background: var(--grad);
      box-shadow: 0 0 10px var(--cyan);
    }

    .card-text {
      font-size: 1.18rem;
      line-height: 1.85;
      color: var(--text);
    }

    .card-tip {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 16px 22px;
      background: rgba(14, 165, 233, 0.08);
      border-left: 4px solid var(--blue);
      border-radius: 14px;
      margin-top: 6px;
    }
    .card-tip i {
      color: var(--cyan);
      font-size: 1.15rem;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .card-tip span {
      font-size: 0.94rem;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .card-footer {
      display: flex; align-items: center; justify-content: space-between;
      border-top: 1px solid rgba(255,255,255,0.07);
      padding-top: 14px;
    }
    .card-teacher { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--text-muted); }
    .card-teacher i { color: var(--cyan); }
    .card-inst { font-size: 0.75rem; color: var(--text-muted); text-align: right; }

    /* ===== LIGHTBOX MODAL ===== */
    .s-lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .s-lightbox.active {
      display: flex;
    }
    .s-lightbox-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(5, 9, 18, 0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    .s-lightbox-content {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 1040px;
      max-height: 92vh;
      display: flex;
      flex-direction: column;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--border);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
      animation: lbIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes lbIn {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }
    .s-lightbox-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(7, 11, 20, 0.6);
    }
    .s-lightbox-title {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--text-heading);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 80%;
    }
    .s-lightbox-close {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s ease;
    }
    .s-lightbox-close:hover {
      background: #ef4444;
      border-color: #ef4444;
      transform: rotate(90deg);
    }
    .s-lightbox-body {
      flex: 1;
      padding: 16px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: auto;
      background: #020617;
      min-height: 380px;
      gap: 14px;
    }
    .s-lightbox-body img {
      max-width: 100%;
      max-height: 60vh;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .s-lightbox-caption {
      width: 100%;
      max-width: 780px;
      padding: 12px 20px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 12px;
      text-align: center;
    }
    .s-lightbox-desc {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #cbd5e1;
      margin: 0;
    }
    .s-lightbox-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(7, 11, 20, 0.6);
    }
    .s-lightbox-nav {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      border-radius: 50px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .s-lightbox-nav:hover {
      background: var(--grad);
      border-color: transparent;
      transform: translateY(-2px);
    }
    .s-lightbox-counter {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--cyan);
      letter-spacing: 1.5px;
    }

    /* ===== RESPONSIVE MEDIA QUERIES ===== */
    @media (max-width: 900px) {
      .s-stage {
        padding: 16px 60px;
      }
      .slide-card {
        padding: 26px 28px;
        min-height: 420px;
      }
      .card-content-wrap {
        min-height: 360px;
      }
      .card-title {
        font-size: 1.5rem;
      }
      .card-text {
        font-size: 1.05rem;
        line-height: 1.7;
      }
    }

    /* ===== NAV ARROWS ===== */
    .s-nav {
      position: absolute;
      top: 50%; transform: translateY(-50%);
      z-index: 40;
      width: 56px; height: 56px;
      border-radius: 50%;
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      color: var(--text-heading);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      box-shadow: 0 8px 28px rgba(0,0,0,0.4);
    }
    .s-nav:hover { background: var(--grad); color: #fff; border-color: transparent; box-shadow: 0 10px 30px rgba(14,165,233,0.45); transform: translateY(-50%) scale(1.08); }
    .s-nav.left { left: 24px; }
    .s-nav.right { right: 24px; }

    /* ===== FOOTER DOCK ===== */
    .s-footer {
      position: relative; z-index: 100;
      padding: 14px 28px 20px;
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      flex-shrink: 0;
    }

    .s-pills {
      display: flex; align-items: center; gap: 8px;
      background: var(--btn-bg);
      padding: 6px 14px;
      border-radius: 50px;
      border: 1px solid var(--btn-border);
      backdrop-filter: blur(14px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      flex-wrap: wrap;
      justify-content: center;
    }

    .s-pill {
      display: flex; align-items: center; gap: 7px;
      padding: 7px 16px;
      border-radius: 50px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      font-size: 0.83rem; font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .s-pill:hover { color: var(--text-heading); background: rgba(255,255,255,0.05); }
    .s-pill.on {
      background: var(--grad); color: #fff;
      box-shadow: 0 4px 14px rgba(14,165,233,0.4);
      transform: scale(1.05);
    }

    .s-hint {
      font-size: 0.75rem; color: var(--text-muted);
      display: flex; align-items: center; gap: 14px;
    }
    .s-hint kbd {
      background: rgba(255,255,255,0.08);
      padding: 2px 6px; border-radius: 4px;
      font-family: monospace; font-size: 0.8rem;
      color: var(--text-heading);
      border: 1px solid rgba(255,255,255,0.12);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 900px) {
      .s-stage { padding: 20px 72px; }
      .slide-card { padding: 30px 28px; border-radius: 20px; }
      .card-title { font-size: 1.45rem; }
      .card-text { font-size: 1.05rem; }
      .s-nav.left { left: 10px; }
      .s-nav.right { right: 10px; }
    }
    @media (max-width: 640px) {
      .s-header-center { display: none; }
      .s-stage { padding: 16px 60px; }
      .slide-card { padding: 22px 18px; border-radius: 16px; }
      .card-title { font-size: 1.2rem; }
      .card-text { font-size: 0.95rem; line-height: 1.6; }
      .card-tip { display: none; }
      .s-pill span { display: none; }
      .s-pill { padding: 8px 10px; }
      .s-hint { display: none; }
      .s-nav { width: 44px; height: 44px; font-size: 1.1rem; }
    }

    /* ===== EMBED MODE (Modal ichida ko'rinishi) ===== */
    body.is-embed .btn-back,
    body.is-embed .topic-sel-wrap {
      display: none !important;
    }
    body.is-embed .s-header {
      padding: 10px 20px;
    }
    body.is-embed .s-stage {
      padding: 12px 64px;
    }
    body.is-embed #deckWrap {
      height: 410px;
      max-width: 820px;
    }
    body.is-embed .slide-card {
      min-height: 400px;
      padding: 28px 36px;
    }
    body.is-embed .card-content-wrap {
      min-height: 340px;
    }
    body.is-embed .card-title {
      font-size: 1.55rem;
    }
    body.is-embed .card-text {
      font-size: 1.1rem;
      line-height: 1.65;
    }
    body.is-embed .s-footer {
      padding: 10px 20px 14px;
    }
    body.is-embed #openExternalBtn {
      display: inline-flex !important;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="s-header">
    <div class="s-header-left">
      <a href="javascript:void(0)" class="btn-back" id="backBtn" title="Oldingi sahifaga qaytish">
        <i class="fas fa-arrow-left"></i>
        <span>Orqaga</span>
      </a>
      <div class="topic-sel-wrap">
        <select id="topicSel" class="topic-sel" aria-label="Mavzuni tanlash"></select>
        <i class="fas fa-chevron-down topic-sel-icon"></i>
      </div>
    </div>

    <div class="s-header-center">
      <span class="s-category" id="sCat">Mavzu</span>
      <h1 class="s-title" id="sTitle">Yuklanmoqda...</h1>
    </div>

    <div class="s-header-right">
      <button class="icon-btn" id="autoBtn" title="Avtoplay (P)"><i class="fas fa-play"></i></button>
      <button class="icon-btn" id="fsBtn" title="To'liq ekran (F)"><i class="fas fa-expand"></i></button>
      <button class="icon-btn" id="themeBtn" title="Mavzu rejimi"><i class="fas fa-moon"></i></button>
      <a href="#" id="openExternalBtn" target="_blank" class="icon-btn" title="Alohida oynada ochish" style="display:none;"><i class="fas fa-arrow-up-right-from-square"></i></a>
    </div>
  </header>

  <!-- PROGRESS -->
  <div class="s-progress"><div class="s-progress-fill" id="progressFill" style="width:20%"></div></div>

  <!-- STAGE: faqat bitta karta ko'rinadi, ghost text yo'q -->
  <main class="s-stage" id="stage">
    <button class="s-nav left" id="prevBtn" aria-label="Oldingi"><i class="fas fa-chevron-left"></i></button>
    <div id="deckWrap" style="position:relative;width:100%;max-width:960px;min-height:480px;height:480px;"></div>
    <button class="s-nav right" id="nextBtn" aria-label="Keyingi"><i class="fas fa-chevron-right"></i></button>
  </main>

  <!-- FOOTER -->
  <footer class="s-footer">
    <div class="s-pills" id="pillsDock"></div>
    <div class="s-hint">
      <span><kbd>←</kbd> Oldingi</span>
      <span><kbd>→</kbd> / <kbd>Space</kbd> Keyingi</span>
      <span><kbd>P</kbd> Avtoplay</span>
      <span><kbd>F</kbd> To'liq ekran</span>
    </div>
  </footer>

  <!-- LIGHTBOX MODAL: Slayd rasmini to'liq hajmda ko'rish -->
  <div class="s-lightbox" id="slideLightbox" role="dialog" aria-modal="true" aria-label="Slayd rasmi">
    <div class="s-lightbox-backdrop" id="lightboxBackdrop"></div>
    <div class="s-lightbox-content">
      <div class="s-lightbox-header">
        <div class="s-lightbox-title" id="lightboxTitle">Slayd illyustratsiyasi</div>
        <button class="s-lightbox-close" id="lightboxClose" aria-label="Yopish"><i class="fas fa-times"></i></button>
      </div>
      <div class="s-lightbox-body">
        <img src="" id="lightboxImg" alt="Katta slayd rasmi">
        <div class="s-lightbox-caption">
          <p class="s-lightbox-desc" id="lightboxDesc"></p>
        </div>
      </div>
      <div class="s-lightbox-footer">
        <button class="s-lightbox-nav" id="lightboxPrev"><i class="fas fa-chevron-left"></i> Oldingi slayd</button>
        <span class="s-lightbox-counter" id="lightboxCounter">SLAYD 01 / 05</span>
        <button class="s-lightbox-nav" id="lightboxNext">Keyingi slayd <i class="fas fa-chevron-right"></i></button>
      </div>
    </div>
  </div>

  <script src="data/course-data.js"></script>
  <script>
  (function () {
    var ICONS = ['fa-bullseye','fa-sitemap','fa-file-shield','fa-hand-holding-medical','fa-shield-virus'];
    var PILL_LABELS = ['1. Maqsad','2. Tuzilishi','3. Standart','4. Texnika','5. Xulosa'];

    var allTopics = [].concat(
      COURSE_CONFIG.practicalTopics || [],
      COURSE_CONFIG.theoreticalTopics || []
    );

    var params = new URLSearchParams(window.location.search);
    var initId = params.get('id') || (allTopics[0] ? allTopics[0].id : '');
    var currentTopic = allTopics.find(function(t){ return t.id === initId; }) || allTopics[0];
    var curIdx = 0;
    var isPlaying = false;
    var playTimer = null;
    var isAnimating = false;   // Ghost text'ni oldini olish uchun
    var isEmbed = params.get('embed') === '1' || window.self !== window.top;
    if (isEmbed) {
      document.body.classList.add('is-embed');
    }

    // DOM
    var topicSel  = document.getElementById('topicSel');
    var sCat      = document.getElementById('sCat');
    var sTitle    = document.getElementById('sTitle');
    var deckWrap  = document.getElementById('deckWrap');
    var pillsDock = document.getElementById('pillsDock');
    var progressFill = document.getElementById('progressFill');
    var prevBtn   = document.getElementById('prevBtn');
    var nextBtn   = document.getElementById('nextBtn');
    var autoBtn   = document.getElementById('autoBtn');
    var fsBtn     = document.getElementById('fsBtn');
    var themeBtn  = document.getElementById('themeBtn');
    var openExternalBtn = document.getElementById('openExternalBtn');

    // ── Mavzular menyusi ──────────────────────────────────────────
    function buildSelector() {
      var grpA = document.createElement('optgroup');
      grpA.label = "AMALIY MASHG'ULOTLAR";
      (COURSE_CONFIG.practicalTopics || []).forEach(function(t) {
        var o = document.createElement('option');
        o.value = t.id;
        o.textContent = t.number + '-amaliy: ' + t.title;
        if (t.id === currentTopic.id) o.selected = true;
        grpA.appendChild(o);
      });
      topicSel.appendChild(grpA);

      var grpN = document.createElement('optgroup');
      grpN.label = "NAZARIY MASHG'ULOTLAR";
      (COURSE_CONFIG.theoreticalTopics || []).forEach(function(t) {
        var o = document.createElement('option');
        o.value = t.id;
        o.textContent = t.number + '-nazariy: ' + t.title;
        if (t.id === currentTopic.id) o.selected = true;
        grpN.appendChild(o);
      });
      topicSel.appendChild(grpN);

      topicSel.addEventListener('change', function(){ switchTopic(topicSel.value); });
    }

    function switchTopic(id) {
      var t = allTopics.find(function(x){ return x.id === id; });
      if (!t) return;
      currentTopic = t;
      curIdx = 0;
      var url = new URL(window.location);
      url.searchParams.set('id', id);
      window.history.replaceState({}, '', url);
      renderTopic();
    }

    // Lightbox elementlari
    var slideLightbox   = document.getElementById('slideLightbox');
    var lightboxBackdrop= document.getElementById('lightboxBackdrop');
    var lightboxClose   = document.getElementById('lightboxClose');
    var lightboxImg     = document.getElementById('lightboxImg');
    var lightboxTitle   = document.getElementById('lightboxTitle');
    var lightboxDesc    = document.getElementById('lightboxDesc');
    var lightboxCounter = document.getElementById('lightboxCounter');
    var lightboxPrev    = document.getElementById('lightboxPrev');
    var lightboxNext    = document.getElementById('lightboxNext');
    var isLightboxOpen  = false;

    // ── Lightbox Boshqaruvi ──────────────────────────────────────
    function openLightbox(idx) {
      var slides = currentTopic.slides || [];
      if (!slides.length) return;
      idx = ((idx % slides.length) + slides.length) % slides.length;
      curIdx = idx;
      updateUI();
      var s = slides[idx];
      var imgSrc = s.image || ('assets/images/slides/' + currentTopic.id + '-slayd-' + (idx+1) + '.svg');
      lightboxImg.src = imgSrc;
      lightboxTitle.textContent = (idx+1) + '-slayd: ' + s.title;
      if (lightboxDesc) lightboxDesc.textContent = s.text;
      lightboxCounter.textContent = 'SLAYD 0' + (idx+1) + ' / 0' + slides.length;
      slideLightbox.classList.add('active');
      isLightboxOpen = true;
    }

    function closeLightbox() {
      slideLightbox.classList.remove('active');
      isLightboxOpen = false;
    }

    function nextLightbox() {
      var slides = currentTopic.slides || [];
      var nextIdx = (curIdx + 1) % slides.length;
      goTo(nextIdx);
      openLightbox(nextIdx);
    }

    function prevLightbox() {
      var slides = currentTopic.slides || [];
      var prevIdx = (curIdx - 1 + slides.length) % slides.length;
      goTo(prevIdx);
      openLightbox(prevIdx);
    }

    if (lightboxClose) lightboxClose.addEventListener('click', closeLightbox);
    if (lightboxBackdrop) lightboxBackdrop.addEventListener('click', closeLightbox);
    if (lightboxPrev) lightboxPrev.addEventListener('click', prevLightbox);
    if (lightboxNext) lightboxNext.addEventListener('click', nextLightbox);

    // ── Mavzu renderlanishi ───────────────────────────────────────
    function renderTopic() {
      sCat.textContent = (currentTopic.categoryName || 'Mavzu') + ' \u2022 ' + currentTopic.number + '-dars';
      sTitle.textContent = currentTopic.title;
      topicSel.value = currentTopic.id;
      document.title = currentTopic.title + ' | 3D Slayd';
      if (openExternalBtn) {
        openExternalBtn.href = 'slayd-3d.html?id=' + encodeURIComponent(currentTopic.id);
      }

      deckWrap.innerHTML = '';
      pillsDock.innerHTML = '';

      var slides = currentTopic.slides || [];
      if (!slides.length) {
        deckWrap.innerHTML = '<div class="slide-card is-active" style="align-items:center;justify-content:center;text-align:center"><h2 class="card-title">Slaydlar mavjud emas</h2></div>';
        return;
      }

      var teacher = (COURSE_CONFIG.teacher || {}).fullName || 'Asem Yakupova';
      var inst    = (COURSE_CONFIG.course || {}).institution || '2-son Nukus JST';

      slides.forEach(function(s, i) {
        var card = document.createElement('div');
        card.className = 'slide-card' + (i === 0 ? ' is-active' : '');
        card.setAttribute('data-idx', i);

        card.innerHTML =
          '<div class="card-content-wrap">' +
            '<div class="card-header-row">' +
              '<div style="display:flex;align-items:center;gap:12px">' +
                '<span class="card-num-pill">SLAYD 0' + (i+1) + ' / 0' + slides.length + '</span>' +
                '<span class="card-cat-label"><i class="fas fa-stethoscope"></i> ' + (currentTopic.categoryName || 'Mavzu') + '</span>' +
              '</div>' +
              '<div class="card-icon-box"><i class="fas ' + ICONS[i % ICONS.length] + '"></i></div>' +
            '</div>' +

            '<div class="card-body">' +
              '<h2 class="card-title">' + s.title + '</h2>' +
              '<div class="card-line"></div>' +
              '<p class="card-text">' + s.text + '</p>' +
              '<div class="card-tip">' +
                '<i class="fas fa-shield-halved"></i>' +
                '<span><strong>Klinik tavsiya:</strong> Muolajani bajarishda sanitariya-epidemiologiya talablari, aseptika va bemor xavfsizligiga qat\'iy amal qiling.</span>' +
              '</div>' +
            '</div>' +

            '<div class="card-footer">' +
              '<div class="card-teacher"><i class="fas fa-user-doctor"></i><span>O\'qituvchi: <strong>' + teacher + '</strong></span></div>' +
              '<div class="card-inst">' + inst + '</div>' +
            '</div>' +
          '</div>';

        deckWrap.appendChild(card);

        // Pill
        var pill = document.createElement('button');
        pill.className = 's-pill' + (i === 0 ? ' on' : '');
        pill.setAttribute('data-pi', i);
        pill.innerHTML = '<i class="fas fa-circle-dot"></i> <span>' + (PILL_LABELS[i] || 'Slayd '+(i+1)) + '</span>';
        pill.addEventListener('click', function(){ goTo(+pill.getAttribute('data-pi')); });
        pillsDock.appendChild(pill);
      });

      updateUI();
    }

    // ── Animatsiya bilan slayd almashtirish ───────────────────────
    // Bu yerda ghost text muammosi hal qilingan: har doim faqat 1 karta ko'rinadi
    function goTo(newIdx) {
      var slides = currentTopic.slides || [];
      if (!slides.length || isAnimating) return;
      newIdx = ((newIdx % slides.length) + slides.length) % slides.length;
      if (newIdx === curIdx) return;

      isAnimating = true;

      var direction = newIdx > curIdx ? 'forward' : 'backward';
      var cards = deckWrap.querySelectorAll('.slide-card');
      var oldCard = cards[curIdx];
      var newCard = cards[newIdx];

      // 1. Yangi kartani belgilangan tomonga yashirin joylashtir
      newCard.classList.remove('is-active', 'exit-left', 'exit-right', 'enter-from-left', 'enter-from-right');
      newCard.classList.add(direction === 'forward' ? 'enter-from-right' : 'enter-from-left');

      // 2. Keyingi frame'da: eski kartani chiqar, yangi kartani kirgiz
      requestAnimationFrame(function() {
        requestAnimationFrame(function() {
          // Eski karta chiqadi
          oldCard.classList.remove('is-active');
          oldCard.classList.add(direction === 'forward' ? 'exit-left' : 'exit-right');

          // Yangi karta kiradi
          newCard.classList.remove('enter-from-left', 'enter-from-right');
          newCard.classList.add('is-active');

          curIdx = newIdx;
          updateUI();

          // Animatsiya tugagach qulfni ochish (CSS transition 0.45s)
          setTimeout(function() {
            // Eski kartalarni tozalash
            cards.forEach(function(c, i) {
              if (i !== curIdx) {
                c.classList.remove('exit-left', 'exit-right', 'enter-from-left', 'enter-from-right', 'is-active');
              }
            });
            isAnimating = false;
          }, 480);
        });
      });
    }

    function updateUI() {
      var slides = currentTopic.slides || [];
      var total = slides.length;

      // Progress
      progressFill.style.width = (total > 0 ? ((curIdx + 1) / total * 100) : 20) + '%';

      // Pills
      var pills = pillsDock.querySelectorAll('.s-pill');
      pills.forEach(function(p) {
        p.classList.toggle('on', +p.getAttribute('data-pi') === curIdx);
      });
    }

    function next() { goTo(curIdx + 1); }
    function prev() { goTo(curIdx - 1); }

    // Navigatsiya
    prevBtn.addEventListener('click', prev);
    nextBtn.addEventListener('click', next);

    // Klaviatura
    window.addEventListener('keydown', function(e) {
      if (isLightboxOpen) {
        if (e.key === 'Escape') { closeLightbox(); }
        else if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextLightbox(); }
        else if (e.key === 'ArrowLeft') { e.preventDefault(); prevLightbox(); }
        return;
      }
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
      else if (e.key === 'f' || e.key === 'F') { toggleFS(); }
      else if (e.key === 'p' || e.key === 'P') { toggleAuto(); }
      else if (e.key === 'Escape' && document.fullscreenElement) { document.exitFullscreen(); }
    });

    // Swipe (mobil)
    var touchX0 = 0;
    document.getElementById('stage').addEventListener('touchstart', function(e) { touchX0 = e.changedTouches[0].screenX; }, { passive: true });
    document.getElementById('stage').addEventListener('touchend', function(e) {
      var dx = e.changedTouches[0].screenX - touchX0;
      if (Math.abs(dx) > 45) { dx < 0 ? next() : prev(); }
    }, { passive: true });

    // Autoplay
    function toggleAuto() {
      isPlaying = !isPlaying;
      autoBtn.classList.toggle('on', isPlaying);
      autoBtn.innerHTML = isPlaying ? '<i class="fas fa-pause"></i>' : '<i class="fas fa-play"></i>';
      clearInterval(playTimer);
      if (isPlaying) { playTimer = setInterval(next, 5000); }
    }
    autoBtn.addEventListener('click', toggleAuto);

    // Fullscreen
    function toggleFS() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
        fsBtn.innerHTML = '<i class="fas fa-compress"></i>';
      } else {
        document.exitFullscreen();
        fsBtn.innerHTML = '<i class="fas fa-expand"></i>';
      }
    }
    fsBtn.addEventListener('click', toggleFS);
    document.addEventListener('fullscreenchange', function() {
      if (!document.fullscreenElement) { fsBtn.innerHTML = '<i class="fas fa-expand"></i>'; }
    });

    // Mavzu (dark/light)
    function initTheme() {
      var t = localStorage.getItem('asem_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
      themeBtn.innerHTML = t === 'dark' ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
    }
    themeBtn.addEventListener('click', function() {
      var t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
      localStorage.setItem('asem_theme', t);
      themeBtn.innerHTML = t === 'dark' ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
    });

    // Orqaga tugmasi: oldingi sahifaga qaytish
    document.getElementById('backBtn').addEventListener('click', function(e) {
      e.preventDefault();
      if (window.opener && !window.opener.closed) {
        window.close();
      } else if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = 'index.html#syllabus';
      }
    });

    // ── Ishga tushirish ───────────────────────────────────────────
    initTheme();
    buildSelector();
    renderTopic();
  })();
  </script>
</body>
</html>
