<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Tibbiyot Video Darslik Player</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    #player-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
    .fallback-box {
      color: #fff;
      text-align: center;
      padding: 24px;
      max-width: 480px;
    }
    .yt-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      padding: 10px 20px;
      background: #e50914;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="player-wrap"></div>
  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const v = params.get('v');
      const title = params.get('title') || 'Video darslik';
      const wrap = document.getElementById('player-wrap');

      if (!v || !/^[\w-]{11}$/.test(v)) {
        wrap.innerHTML = `
          <div class="fallback-box">
            <p>Video ID topilmadi.</p>
          </div>
        `;
        return;
      }

      // Origin va Referrer mavjud bo'lgan HTTPS orqali YouTube iframe yuklanadi (Error 153 bartaraf etiladi)
      wrap.innerHTML = `
        <iframe 
          id="ytFrame"
          src="https://www.youtube.com/embed/${v}?rel=0&modestbranding=1&enablejsapi=0" 
          title="${title.replace(/"/g, '&quot;')}"
          referrerpolicy="strict-origin-when-cross-origin"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
          allowfullscreen>
        </iframe>
      `;
    })();
  </script>
</body>
</html>
